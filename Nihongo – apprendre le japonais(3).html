const ms=Object.keys(g.miss).map(c=>KANA.find(k=>k.c==c));
$("#m").innerHTML=`<h2>Partie terminée</h2><div class="card"><div class="big" style="font-size:48px">${g.sc}</div><p class="mid sub">points · meilleur score : ${S.best}</p>
<b>Caractères ratés (temps écoulé)</b><div class="grid" style="margin-top:8px">${ms.map(k=>`<div class="k"><b class="jp">${k.c}</b><small>${k.r} · ${g.miss[k.c]}×</small></div>`).join("")}</div>
<div class="row"><button class="btn" onclick="gstart()">Rejouer</button>${ms.length?`<button class="btn g" onclick='gstart(window.__m)'>Rejouer les ratés</button>`:''}<button class="btn g" onclick="game()">Retour au menu</button></div></div>`;window.__m=ms}
/* ---------- Progression ---------- */
function set(){const c=t=>KANA.filter(k=>k.t==t&&S.lk[k.t+k.c]).length,T=KANA.filter(k=>k.t=='h').length;
const tot=S.res.reduce((a,r)=>a+r.n,0),ok=S.res.reduce((a,r)=>a+r.s,0);
const wr=Object.keys(S.wrong).sort((a,b)=>S.wrong[b]-S.wrong[a]).slice(0,12).map(x=>x.slice(1));
const row=(l,v,t)=>`<div style="margin-bottom:12px"><div class="row" style="justify-content:space-between;margin:0 0 4px"><span>${l}</span><small>${v} / ${t}</small></div>${bar(v/t*100)}</div>`;
$("#m").innerHTML=`<h2>${ic('set')}Progression et paramètres</h2><p class="intro">Votre avancement, le thème de l’application et la réinitialisation des données.</p><div class="card">${row('Hiragana appris',c('h'),T)}${row('Katakana appris',c('k'),T)}${row('Kanji appris',KJ.filter(k=>S.lk['j'+k.c]).length,KJ.length)}${row('Mots appris',Object.keys(S.lw).length,W.length)}
<div class="sub">Histoires lues : ${Object.keys(S.rf||{}).length} · Quiz réalisés : ${S.res.length} · Réussite : ${tot?Math.round(ok/tot*100)+' %':'–'}</div></div>
<div class="card"><b>À retravailler</b><div class="row">${wr.map(c=>`<span class="jp" style="font-size:26px">${c}</span>`).join("")||'<small>Rien pour l\'instant.</small>'}</div></div>
<div class="card"><b>Thème</b><div class="row">${[['auto','Automatique'],['light','Jour'],['dark','Nuit'],['sakura','Sakura'],['bambou','Bambou'],['indigo','Indigo'],['kaki','Kaki (automne)']].map(x=>`<button class="btn g ${S.theme==x[0]?'on':''}" onclick="S.theme='${x[0]}';save();setTheme();set()">${x[1]}</button>`).join("")}</div>
<small>Les données sont enregistrées dans ce navigateur uniquement (pas de synchronisation entre appareils).</small>
<div class="row"><button class="btn" onclick="if(confirm('Réinitialiser toute la progression ?')){localStorage.removeItem('nj');location.reload()}">Réinitialiser la progression</button></div></div>`}
go('home');
</script></body></html>
